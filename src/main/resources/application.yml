spring:
  application:
    name: expense-precheck
  config:
    # 规则配置单独放一个文件，并且允许"jar 外面的 rules.yml"覆盖它。
    # 这样客户想改规则，只要在 jar 同级目录放一个 rules.yml，重启即可，不用重新打包。
    import:
      - classpath:rules.yml
      - optional:file:./rules.yml
  servlet:
    multipart:
      # 发票一般 150KB 左右，但合并成一册的报销材料会大很多，放宽到 20MB
      max-file-size: 20MB
      max-request-size: 40MB

server:
  # 故意不用 8080：你 IDEA 里跑 second-classroom 时占着 8080，撞上就互相打架
  port: 8090

precheck:
  ai:
    # 语义检查开关。false 时只用代码规则，系统照样能跑
    enabled: true
    base-url: https://api.deepseek.com
    model: deepseek-chat
    # ⚠️ Key 不要写死在这里，用环境变量传：PRECHECK_AI_KEY=sk-xxxx
    # 没配 Key 也没关系——会自动降级成"只用硬规则"，不会报错
    api-key: ${PRECHECK_AI_KEY:}
    timeout-seconds: 20

  ledger:
    # 发票历史台账。只存发票号的 SHA-256（不存明文），用于跨申请查重。
    # 相对路径按启动目录解析 —— 放在 jar 旁边，重启不丢，也不会被打进 jar 里。
    file: data/invoice-ledger.json

  auth:
    # 是否校验"上游 OA 传来的申请人签名"。
    #
    # ⚠️ 默认 false，只为了"克隆下来就能跑、能演示"。这个状态下申请人取自请求体，
    #    员工可以随便填，历史台账记的也就不是可信的名字 —— 启动日志会打 WARN，页面顶部会挂横幅。
    #
    # ✅ 接入 OA / 生产环境必须改成 true，并用环境变量注入共享密钥：
    #      PRECHECK_AUTH_SECRET=<与 OA 约定的密钥>
    #    开着验签却没配 secret 会直接启动失败（宁可起不来，也不带着空密钥假装验过）。
    enabled: false
    secret: ${PRECHECK_AUTH_SECRET:}
    # 时间戳允许的偏移（秒）。防止截获的请求头被无限重放，代价是两端时钟不能差太多。
    tolerance-seconds: 300

