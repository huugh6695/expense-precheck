# ============================================================
# 预检规则配置
#
# 这个文件就是"制度"的落地形式。财务说"差旅必须交住宿票"，
# 改这里一行就行，不用改 Java 代码、不用重新编译。
#
# 想在不重新打包的情况下改规则：把本文件复制到 jar 同级目录，
# 改完重启即可生效（启动时会自动读，见 application.yml 里的 spring.config.import）。
# ============================================================
precheck:
  rules:

    # 金额比较的容差。两个金额差在这个范围内就算一致。
    # 默认 1 分钱：真实发票的合计常常四舍五入过，硬比会天天误报。
    amount-tolerance: 0.01

    # 每类申请必须有哪些票据。
    #   category = 费用类别（申请单里选的那个），写「默认」表示兜底
    #   required = 必须齐备的票据类型
    # 票据类型只有三种：
    #   TRAVEL  = 交通（机票、火车票、打车）
    #   HOTEL   = 住宿
    #   INVOICE = 其他发票
    #
    # ⚠️ 这里刻意用「列表」而不是「以类别为 key 的 map」：
    #    Spring 的配置绑定对中文 key 不生效（会静默失效，很难查），
    #    但中文当「值」是完全没问题的。这个坑踩过一次，别再改回去。
    required-attachments:
      - category: 差旅
        required: [TRAVEL, HOTEL]
      - category: 招待
        required: [INVOICE]
      - category: 办公
        required: [INVOICE]
      - category: 默认
        required: [INVOICE]

    # 判断票据类型的关键词。
    # ⚠️ 顺序有意义：先判 HOTEL 再判 TRAVEL。
    #    因为住宿发票的项目名可能是「住宿服务」，而交通票不会；
    #    反过来先判交通也一般没问题，但保持这个顺序更稳。
    # ⚠️ 只匹配「开票项目 + 开票方」，不扫全文——备注里常出现
    #    「附住宿发票一张」这类字样，扫全文会误判。
    ticket-keywords:
      HOTEL:
        - 住宿服务
        - 住宿费
        - 客房
        - 酒店
        - 宾馆
        - 旅馆
        - 民宿
        - 公寓
      TRAVEL:
        - 运输服务
        - 客运
        - 航空
        - 机票
        - 铁路
        - 火车
        - 动车
        - 高铁
        - 出租车
        - 网约车
        - 滴滴
        - 出行
        - 航旅
        - 机场
        - 车费
